services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      # login.sh saves host credentials as workbuddy-<uid>.json (0600). The gateway
      # reads and updates them as app (UID 10001); refresh/backfill needs directory write access.
      # Different host/container UIDs can prevent reading credentials, leaving zero accounts
      # (issue #108). After login, set directory ownership to 10001, as with ./data:
      #   chown -R 10001:10001 ./auths
      # Add subsequent accounts inside the container for correct ownership. It has no
      # Docker CLI; restart from the host afterward:
      #   docker compose exec -it wb2api bash -c './login.sh' && docker compose restart wb2api
      - ./auths:/app/auths
      # Keep data as a local bind mount, matching previous versions.
      # If app (UID 10001) cannot write state.json, run this on the host:
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
